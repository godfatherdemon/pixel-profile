name: generate-and-upload-card

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github stats card
        uses: godfatherdemon/pixel-profile/action@main
        with:
          outputs: |
            dist/github-stats?username=godfatherdemon&screen_effect=false&theme=fuji&dithering=true&hide=avatar
            dist/github-stats-dark?username=godfatherdemon&theme=crt

      - name: push github stats card to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
